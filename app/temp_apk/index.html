<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>心跳互联 Heartbeat Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --primary: #e94560;
            --secondary: #16213e;
            --accent: #0f3460;
            --text: #ffffff;
            --glow: rgba(233, 69, 96, 0.6);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--text);
            text-shadow: 0 0 20px var(--glow);
            margin-bottom: 8px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        .pairing-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text);
            font-size: 16px;
            outline: none;
        }

        .input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #d63d56;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .pair-code {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            margin: 15px 0;
        }

        .pair-code-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .pair-code-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 8px;
            text-shadow: 0 0 20px var(--glow);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            display: none;
        }

        .main-content.active {
            display: flex;
        }

        .heart-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .heart-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .heart-icon {
            font-size: 120px;
            animation: heartbeat 1s infinite ease-in-out;
            filter: drop-shadow(0 0 20px var(--glow));
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.1); }
        }

        .heart-rate {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 15px var(--glow);
        }

        .heart-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .partner-heart {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .partner-heart .heart-icon {
            font-size: 60px;
        }

        .partner-heart .heart-rate {
            font-size: 28px;
        }

        .partner-name {
            font-size: 14px;
            color: var(--text);
            margin-top: 10px;
            opacity: 0.8;
        }

        .lightning-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .lightning-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--primary), #b8304f);
            border: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px var(--glow);
        }

        .lightning-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px var(--glow);
        }

        .lightning-btn:active {
            transform: scale(0.95);
        }

        .lightning-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            animation: none;
        }

        .lightning-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary);
            animation: ripple 1.5s infinite;
            opacity: 0;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .lightning-label {
            margin-top: 20px;
            font-size: 18px;
            color: var(--text);
            text-align: center;
        }

        .stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary);
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .radar-hint {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 15px;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 18px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 4px 20px var(--glow);
        }

        .notification.show {
            opacity: 1;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100px); }
            to { transform: translateX(-50%) translateY(0); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="starsBg"></div>
    <canvas class="stars-canvas" id="starsCanvas"></canvas>
    
    <div class="container">
        <div class="header">
            <div class="logo">💓 心跳互联</div>
            <div class="status-bar">
                <div class="status-item">
                    <span class="status-dot" id="connectionDot"></span>
                    <span id="connectionStatus">未连接</span>
                </div>
            </div>
        </div>

        <div class="pairing-section" id="pairingSection">
            <div class="section-title">连接你的心跳</div>
            
            <div class="input-group">
                <input type="text" class="input" id="nameInput" placeholder="输入你的昵称" maxlength="20">
            </div>

            <button class="btn btn-secondary" id="generateCodeBtn" style="width: 100%; margin-bottom: 10px;">
                ✨ 生成配对码
            </button>

            <div class="pair-code hidden" id="pairCodeBox">
                <div class="pair-code-label">分享这个码给TA</div>
                <div class="pair-code-value" id="pairCodeDisplay">------</div>
            </div>

            <div style="text-align: center; margin: 20px 0; color: rgba(255,255,255,0.5);">— 或 —</div>

            <div class="input-group">
                <input type="text" class="input" id="joinCodeInput" placeholder="输入对方的配对码" maxlength="6" style="text-transform: uppercase;">
                <button class="btn btn-primary" id="joinCodeBtn">加入</button>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="heart-section">
                <div class="heart-container">
                    <div class="heart-icon" id="myHeart">❤️</div>
                </div>
                <div class="heart-rate" id="myHeartRate">--</div>
                <div class="heart-label">你的心率 (BPM)</div>

                <div class="partner-heart" id="partnerSection">
                    <div class="heart-container">
                        <div class="heart-icon" id="partnerHeart">🤍</div>
                    </div>
                    <div class="heart-rate" id="partnerHeartRate">--</div>
                    <div class="partner-name" id="partnerName">等待配对...</div>
                </div>
            </div>

            <div class="lightning-section">
                <button class="lightning-btn disabled" id="lightningBtn">⚡</button>
                <div class="lightning-label">长按发送雷达触感<br>点击发送闪电震动</div>
            </div>

            <div class="stats-section">
                <div class="section-title">互动统计</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="sentCount">0</div>
                        <div class="stat-label">已发送</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="receivedCount">0</div>
                        <div class="stat-label">已接收</div>
                    </div>
                </div>
                <div class="radar-hint">📍 持续按住闪电按钮体验雷达触感反馈</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="notification" id="notification"></div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const App = {
            socket: null,
            userId: null,
            partner: null,
            paired: false,
            simulatedHeartRate: 72,
            partnerHeartRate: null,
            radarInterval: null,
            lastRadarTime: 0,
            stars: [],

            init() {
                this.createStars();
                this.initCanvas();
                this.bindEvents();
                this.connectSocket();
            },

            createStars() {
                const bg = document.getElementById('starsBg');
                for (let i = 0; i < 50; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = Math.random() * 3 + 1 + 'px';
                    star.style.height = star.style.width;
                    star.style.animationDelay = Math.random() * 2 + 's';
                    bg.appendChild(star);
                }
            },

            initCanvas() {
                this.canvas = document.getElementById('starsCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                this.animateStars();
            },

            resizeCanvas() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },

            animateStars() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.stars = this.stars.filter(star => star.alpha > 0);
                
                this.stars.forEach(star => {
                    this.ctx.beginPath();
                    this.ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(255, 215, 0, ${star.alpha})`;
                    this.ctx.fill();
                    
                    if (star.type === 'glow') {
                        this.ctx.beginPath();
                        this.ctx.arc(star.x, star.y, star.size * 2, 0, Math.PI * 2);
                        this.ctx.fillStyle = `rgba(255, 215, 0, ${star.alpha * 0.3})`;
                        this.ctx.fill();
                    }
                    
                    star.alpha -= 0.02;
                    star.y -= star.speed;
                    star.x += Math.sin(star.angle) * 0.5;
                    star.angle += 0.1;
                });

                requestAnimationFrame(() => this.animateStars());
            },

            createStarExplosion(x, y) {
                const colors = ['#FFD700', '#FFA500', '#FF6347', '#FFFFFF'];
                for (let i = 0; i < 30; i++) {
                    const angle = (Math.PI * 2 / 30) * i;
                    const speed = Math.random() * 3 + 2;
                    this.stars.push({
                        x: x,
                        y: y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * 4 + 2,
                        alpha: 1,
                        speed: speed,
                        angle: angle,
                        type: Math.random() > 0.7 ? 'glow' : 'normal',
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
            },

            bindEvents() {
                document.getElementById('generateCodeBtn').addEventListener('click', () => this.generateCode());
                document.getElementById('joinCodeBtn').addEventListener('click', () => this.joinCode());
                
                const lightningBtn = document.getElementById('lightningBtn');
                
                lightningBtn.addEventListener('click', (e) => {
                    if (!this.paired) return;
                    this.triggerLightning();
                });

                let radarTimeout;
                lightningBtn.addEventListener('touchstart', (e) => {
                    if (!this.paired) return;
                    e.preventDefault();
                    this.startRadarFeedback();
                    radarTimeout = setTimeout(() => {
                        this.triggerLightning();
                    }, 1000);
                });

                lightningBtn.addEventListener('touchend', (e) => {
                    clearTimeout(radarTimeout);
                    this.stopRadarFeedback();
                });

                lightningBtn.addEventListener('mousedown', (e) => {
                    if (!this.paired) return;
                    this.startRadarFeedback();
                    radarTimeout = setTimeout(() => {
                        this.triggerLightning();
                    }, 1000);
                });

                lightningBtn.addEventListener('mouseup', () => {
                    clearTimeout(radarTimeout);
                    this.stopRadarFeedback();
                });

                lightningBtn.addEventListener('mouseleave', () => {
                    clearTimeout(radarTimeout);
                    this.stopRadarFeedback();
                });
            },

            connectSocket() {
                const serverUrl = 'http://192.168.134.126:3000';
                
                try {
                    this.socket = io(serverUrl, {
                        transports: ['websocket', 'polling'],
                        reconnection: true,
                        reconnectionAttempts: 5,
                        reconnectionDelay: 1000
                    });

                    this.socket.on('connect', () => {
                        console.log('Connected to server');
                        document.getElementById('connectionDot').style.background = '#4ade80';
                        document.getElementById('connectionStatus').textContent = '已连接';
                        
                        const name = document.getElementById('nameInput').value || 'Anonymous';
                        this.socket.emit('register', { name });
                    });

                    this.socket.on('registered', (data) => {
                        this.userId = data.id;
                        console.log('Registered as:', data.name);
                    });

                    this.socket.on('code_generated', (data) => {
                        document.getElementById('pairCodeDisplay').textContent = data.code;
                        document.getElementById('pairCodeBox').classList.remove('hidden');
                        this.showToast('配对码已生成！');
                    });

                    this.socket.on('paired', (data) => {
                        this.paired = true;
                        this.partner = data.partner;
                        
                        document.getElementById('pairingSection').classList.add('hidden');
                        document.getElementById('mainContent').classList.add('active');
                        document.getElementById('lightningBtn').classList.remove('disabled');
                        document.getElementById('partnerName').textContent = data.partner.name;
                        document.getElementById('partnerHeart').textContent = data.partner.avatar;
                        
                        this.updateStats(data.stats);
                        this.startHeartRateSimulation();
                        this.showNotification(`${data.partner.name} 已连接！`);
                    });

                    this.socket.on('partner_heartbeat', (data) => {
                        this.partnerHeartRate = data.bpm;
                        document.getElementById('partnerHeartRate').textContent = data.bpm;
                    });

                    this.socket.on('lightning_received', (data) => {
                        this.triggerVibration();
                        this.createStarExplosion(window.innerWidth / 2, window.innerHeight / 2);
                        this.showNotification(`${data.fromName} 给你发了闪电！⚡`);
                        this.flashScreen();
                    });

                    this.socket.on('stats_update', (data) => {
                        this.updateStats(data);
                    });

                    this.socket.on('partner_disconnected', (data) => {
                        this.showNotification(`${data.name} 已断开连接`);
                        this.paired = false;
                        document.getElementById('lightningBtn').classList.add('disabled');
                        document.getElementById('partnerHeartRate').textContent = '--';
                    });

                    this.socket.on('error', (data) => {
                        this.showToast(data.message);
                    });

                    this.socket.on('disconnect', () => {
                        document.getElementById('connectionDot').style.background = '#ef4444';
                        document.getElementById('connectionStatus').textContent = '连接断开';
                    });

                } catch (error) {
                    console.error('Socket connection failed:', error);
                    document.getElementById('connectionStatus').textContent = '连接失败';
                    this.showToast('无法连接到服务器，请确保后端服务已启动');
                }
            },

            generateCode() {
                if (this.socket && this.socket.connected) {
                    this.socket.emit('generate_code');
                } else {
                    this.showToast('请等待连接建立');
                }
            },

            joinCode() {
                const code = document.getElementById('joinCodeInput').value.toUpperCase();
                if (code.length !== 6) {
                    this.showToast('请输入6位配对码');
                    return;
                }
                if (this.socket && this.socket.connected) {
                    this.socket.emit('join_code', { code });
                } else {
                    this.showToast('请等待连接建立');
                }
            },

            triggerLightning() {
                if (this.socket && this.socket.connected && this.paired) {
                    this.socket.emit('lightning');
                    this.triggerVibration();
                    
                    const rect = document.getElementById('lightningBtn').getBoundingClientRect();
                    this.createStarExplosion(
                        rect.left + rect.width / 2,
                        rect.top + rect.height / 2
                    );
                }
            },

            startRadarFeedback() {
                if (!navigator.vibrate) return;
                
                let intensity = 100;
                this.radarInterval = setInterval(() => {
                    const now = Date.now();
                    if (now - this.lastRadarTime > 300) {
                        navigator.vibrate(intensity);
                        this.lastRadarTime = now;
                        intensity = Math.max(50, intensity - 10);
                    }
                }, 100);
            },

            stopRadarFeedback() {
                if (this.radarInterval) {
                    clearInterval(this.radarInterval);
                    this.radarInterval = null;
                }
                if (navigator.vibrate) {
                    navigator.vibrate(0);
                }
            },

            triggerVibration() {
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 200]);
                }
            },

            flashScreen() {
                const overlay = document.createElement('div');
                overlay.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(255, 215, 0, 0.3);
                    z-index: 999;
                    pointer-events: none;
                    animation: flashFade 0.5s ease-out forwards;
                `;
                document.body.appendChild(overlay);
                setTimeout(() => overlay.remove(), 500);
            },

            updateStats(stats) {
                document.getElementById('sentCount').textContent = stats.sent || 0;
                document.getElementById('receivedCount').textContent = stats.received || 0;
            },

            startHeartRateSimulation() {
                setInterval(() => {
                    this.simulatedHeartRate = 65 + Math.floor(Math.random() * 15);
                    document.getElementById('myHeartRate').textContent = this.simulatedHeartRate;
                    
                    if (this.socket && this.socket.connected && this.paired) {
                        this.socket.emit('heartbeat', {
                            bpm: this.simulatedHeartRate,
                            timestamp: Date.now()
                        });
                    }
                }, 2000);
            },

            showToast(message) {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            },

            showNotification(message) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes flashFade {
                    from { opacity: 1; }
                    to { opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
